<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小龙虾语音助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #fff;
      display: flex;
      flex-direction: column;
    }

    .header {
      text-align: center;
      padding: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .header h1 {
      font-size: 24px;
      background: linear-gradient(90deg, #ff6b6b, #ffa502);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header .subtitle {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      margin-top: 4px;
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      font-size: 13px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #666;
      transition: background 0.3s;
    }

    .status-dot.idle { background: #666; }
    .status-dot.wake { background: #a29bfe; animation: pulse 2s infinite; }
    .status-dot.listening { background: #4ecdc4; animation: pulse 1.2s infinite; }
    .status-dot.thinking { background: #ffa502; animation: pulse 0.8s infinite; }
    .status-dot.speaking { background: #ff6b6b; animation: pulse 1s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.4); }
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: calc(100vh - 240px);
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      animation: fadeIn 0.3s ease;
      word-break: break-word;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      align-self: flex-start;
      background: rgba(255,255,255,0.1);
      border-bottom-left-radius: 4px;
    }

    .message.system {
      align-self: center;
      background: rgba(255,255,255,0.05);
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      border-radius: 8px;
      padding: 6px 12px;
    }

    .input-area {
      padding: 12px 16px;
      border-top: 1px solid rgba(255,255,255,0.1);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .input-area input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }

    .input-area input:focus { border-color: rgba(255,255,255,0.5); }

    .btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, opacity 0.2s;
      flex-shrink: 0;
    }

    .btn:hover { transform: scale(1.1); }
    .btn:active { transform: scale(0.95); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btn-mic { background: linear-gradient(135deg, #4ecdc4, #44bd9e); }
    .btn-mic.active { background: linear-gradient(135deg, #ff6b6b, #ee5a24); animation: pulse 1s infinite; }
    .btn-send { background: linear-gradient(135deg, #667eea, #764ba2); }

    .btn svg { width: 20px; height: 20px; fill: #fff; }

    .controls {
      display: flex;
      gap: 10px;
      padding: 0 16px 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .control-btn {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.8);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .control-btn:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.4); }
    .control-btn.active { background: rgba(78,205,196,0.2); border-color: #4ecdc4; color: #4ecdc4; }

    .visualizer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 30px;
      padding: 0 16px;
    }

    .visualizer.hidden { display: none; }

    .bar {
      width: 4px;
      background: #4ecdc4;
      border-radius: 2px;
      animation: barPulse 0.8s ease-in-out infinite;
    }

    @keyframes barPulse {
      0%, 100% { height: 4px; }
      50% { height: 20px; }
    }

    .bar:nth-child(1) { animation-delay: 0s; }
    .bar:nth-child(2) { animation-delay: 0.1s; }
    .bar:nth-child(3) { animation-delay: 0.2s; }
    .bar:nth-child(4) { animation-delay: 0.3s; }
    .bar:nth-child(5) { animation-delay: 0.4s; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🦐 小龙虾语音助手</h1>
    <div class="subtitle">说"开始"唤醒 · 说"结束"休眠 · 持续对话模式</div>
  </div>

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">点击下方按钮启动</span>
  </div>

  <div class="visualizer hidden" id="visualizer">
    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
  </div>

  <div class="chat-container" id="chatContainer"></div>

  <div class="controls">
    <button class="control-btn" id="btnWake" onclick="toggleWakeMode()">启动唤醒监听</button>
    <button class="control-btn" id="btnConversation" onclick="toggleConversationMode()">直接对话模式</button>
    <button class="control-btn" id="btnClear" onclick="clearChat()">清空对话</button>
  </div>

  <div class="input-area">
    <input type="text" id="textInput" placeholder="输入文字或使用语音..." onkeydown="if(event.key==='Enter')sendText()">
    <button class="btn btn-mic" id="btnMic" onclick="toggleManualMic()">
      <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    </button>
    <button class="btn btn-send" onclick="sendText()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>

  <script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    // 状态机
    const STATE = {
      IDLE: 'idle',
      WAKE_LISTENING: 'wake',        // 等待唤醒词
      CONVERSATION_LISTENING: 'listening', // 对话模式-正在听
      THINKING: 'thinking',          // AI处理中
      SPEAKING: 'speaking'           // 语音播报中
    };

    let currentState = STATE.IDLE;
    let recognition = null;
    let chatHistory = [];
    let currentAudio = null;
    let conversationMode = false; // 是否在持续对话模式中

    const WAKE_WORDS = ['开始', '你好小龙虾', '小龙虾', '你好'];
    const SLEEP_WORDS = ['结束', '再见', '休息', '停止'];

    function setState(state, text) {
      currentState = state;
      const dot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const visualizer = document.getElementById('visualizer');

      dot.className = 'status-dot ' + state;
      statusText.textContent = text;

      if (state === STATE.CONVERSATION_LISTENING) {
        visualizer.classList.remove('hidden');
      } else {
        visualizer.classList.add('hidden');
      }
    }

    function addMessage(role, content) {
      const container = document.getElementById('chatContainer');
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = content;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;

      if (role === 'user' || role === 'assistant') {
        chatHistory.push({ role, content });
        if (chatHistory.length > 20) chatHistory = chatHistory.slice(-20);
      }
    }

    // ============ 核心语音识别 - 统一实例持续运行 ============

    function createRecognition() {
      if (!SpeechRecognition) {
        addMessage('system', '浏览器不支持语音识别，请使用 Chrome/Edge');
        return null;
      }

      const rec = new SpeechRecognition();
      rec.lang = 'zh-CN';
      rec.continuous = true;
      rec.interimResults = true;
      return rec;
    }

    function updateInputDisplay(text, isFinal) {
      const input = document.getElementById('textInput');
      input.value = text;
      if (!isFinal) {
        input.style.color = 'rgba(255,255,255,0.5)';
      } else {
        input.style.color = '#fff';
      }
    }

    function stopRecognition() {
      if (recognition) {
        recognition.onend = null;
        recognition.onresult = null;
        recognition.onerror = null;
        try { recognition.stop(); } catch(e) {}
        recognition = null;
      }
    }

    // ============ 唤醒模式 - 持续监听唤醒词 ============

    function toggleWakeMode() {
      if (currentState === STATE.WAKE_LISTENING) {
        exitAllModes();
      } else {
        exitAllModes();
        startWakeListening();
      }
    }

    function startWakeListening() {
      stopRecognition();
      recognition = createRecognition();
      if (!recognition) return;

      document.getElementById('btnWake').classList.add('active');
      document.getElementById('btnWake').textContent = '停止唤醒监听';
      setState(STATE.WAKE_LISTENING, '等待唤醒词: "开始" / "小龙虾"');

      recognition.onresult = (event) => {
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript.trim();
          const isFinal = event.results[i].isFinal;

          // 实时显示在输入框
          updateInputDisplay(transcript, isFinal);

          if (WAKE_WORDS.some(w => transcript.includes(w))) {
            updateInputDisplay('', true);
            addMessage('system', `唤醒成功! 进入对话模式`);
            enterConversationMode();
            return;
          }

          // final 结果如果不是唤醒词，清空显示
          if (isFinal) {
            setTimeout(() => updateInputDisplay('', true), 800);
          }
        }
      };

      recognition.onend = () => {
        // 持续重启，直到状态改变
        if (currentState === STATE.WAKE_LISTENING) {
          setTimeout(() => {
            if (currentState === STATE.WAKE_LISTENING) {
              try { recognition.start(); } catch(e) {}
            }
          }, 100);
        }
      };

      recognition.onerror = (e) => {
        if (e.error === 'no-speech' || e.error === 'aborted') return;
        console.error('[唤醒错误]', e.error);
      };

      recognition.start();
    }

    // ============ 对话模式 - 持续监听用户语音 ============

    function toggleConversationMode() {
      if (conversationMode) {
        exitAllModes();
      } else {
        exitAllModes();
        enterConversationMode();
      }
    }

    function enterConversationMode() {
      conversationMode = true;
      document.getElementById('btnConversation').classList.add('active');
      document.getElementById('btnConversation').textContent = '停止对话';
      document.getElementById('btnWake').classList.remove('active');
      document.getElementById('btnWake').textContent = '启动唤醒监听';
      startConversationListening();
    }

    function startConversationListening() {
      if (!conversationMode) return;

      stopRecognition();
      recognition = createRecognition();
      if (!recognition) return;

      setState(STATE.CONVERSATION_LISTENING, '正在聆听... 说话即可对话');
      document.getElementById('btnMic').classList.add('active');

      let silenceTimer = null;
      let finalText = '';

      recognition.onresult = (event) => {
        let currentInterim = '';

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript.trim();
          if (!transcript) continue;

          if (event.results[i].isFinal) {
            // 检查结束词
            if (SLEEP_WORDS.some(w => transcript.includes(w))) {
              updateInputDisplay('', true);
              addMessage('system', '语音助手已休眠，说"开始"重新唤醒');
              exitAllModes();
              startWakeListening();
              return;
            }

            finalText += transcript;
            updateInputDisplay(finalText, true);

            // 收到 final 后设置静默计时器
            clearTimeout(silenceTimer);
            silenceTimer = setTimeout(() => {
              if (finalText.trim()) {
                const textToSend = finalText.trim();
                finalText = '';
                updateInputDisplay('', true);
                processUserInput(textToSend);
              }
            }, 1500);
          } else {
            currentInterim += transcript;
          }
        }

        // 实时显示中间结果
        if (currentInterim) {
          updateInputDisplay(finalText + currentInterim, false);
        }
      };

      recognition.onend = () => {
        document.getElementById('btnMic').classList.remove('active');
        // 如果还在对话模式且不在处理中，则自动重启
        if (conversationMode && currentState === STATE.CONVERSATION_LISTENING) {
          setTimeout(() => {
            if (conversationMode && currentState === STATE.CONVERSATION_LISTENING) {
              try {
                recognition.start();
                document.getElementById('btnMic').classList.add('active');
              } catch(e) {
                // 短暂延迟后重试
                setTimeout(() => startConversationListening(), 500);
              }
            }
          }, 200);
        }
      };

      recognition.onerror = (e) => {
        if (e.error === 'no-speech') {
          // 无语音是正常的，自动重启即可
          return;
        }
        if (e.error === 'aborted') return;
        console.error('[对话错误]', e.error);
        if (e.error === 'not-allowed') {
          addMessage('system', '麦克风权限被拒绝，请允许麦克风访问');
          exitAllModes();
        }
      };

      try {
        recognition.start();
      } catch(e) {
        setTimeout(() => startConversationListening(), 500);
      }
    }

    // ============ 处理用户输入 → AI → TTS → 继续听 ============

    async function processUserInput(text) {
      stopRecognition();
      document.getElementById('btnMic').classList.remove('active');
      document.getElementById('textInput').value = '';
      document.getElementById('textInput').style.color = '#fff';
      addMessage('user', text);
      setState(STATE.THINKING, 'AI 思考中...');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, history: chatHistory.slice(0, -1) })
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
          throw new Error(err.error || `请求失败 ${res.status}`);
        }

        const data = await res.json();
        addMessage('assistant', data.reply);

        // TTS 播报
        setState(STATE.SPEAKING, '语音播报中...');
        await playTTS(data.reply);

      } catch (err) {
        addMessage('system', '出错: ' + err.message);
      }

      // 播报完毕后，如果还在对话模式，自动恢复监听
      if (conversationMode) {
        startConversationListening();
      } else {
        setState(STATE.IDLE, '就绪');
      }
    }

    // ============ TTS 播报 ============

    async function playTTS(text) {
      try {
        const res = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });

        if (!res.ok) throw new Error('TTS failed');

        const blob = await res.blob();
        if (blob.type.includes('json')) throw new Error('TTS returned error');

        const url = URL.createObjectURL(blob);
        return new Promise((resolve) => {
          if (currentAudio) { currentAudio.pause(); currentAudio = null; }
          currentAudio = new Audio(url);
          currentAudio.onended = () => { URL.revokeObjectURL(url); resolve(); };
          currentAudio.onerror = () => { URL.revokeObjectURL(url); fallbackTTS(text); resolve(); };
          currentAudio.play().catch(() => { fallbackTTS(text); resolve(); });
        });
      } catch {
        await fallbackTTS(text);
      }
    }

    function fallbackTTS(text) {
      return new Promise((resolve) => {
        if (!('speechSynthesis' in window)) { resolve(); return; }
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        utterance.rate = 1.1;
        utterance.onend = resolve;
        utterance.onerror = resolve;
        speechSynthesis.speak(utterance);
      });
    }

    // ============ 手动操作 ============

    function toggleManualMic() {
      if (currentState === STATE.CONVERSATION_LISTENING) {
        exitAllModes();
      } else if (currentState === STATE.IDLE || currentState === STATE.WAKE_LISTENING) {
        exitAllModes();
        enterConversationMode();
      }
    }

    async function sendText() {
      const input = document.getElementById('textInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      const wasInConversation = conversationMode;
      if (currentState === STATE.CONVERSATION_LISTENING) {
        stopRecognition();
      }

      await processUserInput(text);

      if (!wasInConversation && !conversationMode) {
        setState(STATE.IDLE, '就绪');
      }
    }

    function exitAllModes() {
      conversationMode = false;
      stopRecognition();
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      speechSynthesis.cancel();

      document.getElementById('btnWake').classList.remove('active');
      document.getElementById('btnWake').textContent = '启动唤醒监听';
      document.getElementById('btnConversation').classList.remove('active');
      document.getElementById('btnConversation').textContent = '直接对话模式';
      document.getElementById('btnMic').classList.remove('active');

      setState(STATE.IDLE, '已停止');
    }

    function clearChat() {
      document.getElementById('chatContainer').innerHTML = '';
      chatHistory = [];
      addMessage('system', '对话已清空');
    }

    // 初始化
    addMessage('system', '小龙虾语音助手已就绪');
    addMessage('system', '「启动唤醒监听」→ 说"开始"唤醒 → 持续对话 → 说"结束"休眠');
    addMessage('system', '「直接对话模式」→ 立刻开始持续语音对话');
  </script>
</body>
</html>
