<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小龙虾语音助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      height: 100vh;
      color: #fff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      text-align: center;
      padding: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 22px;
      background: linear-gradient(90deg, #ff6b6b, #ffa502);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header .subtitle {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      margin-top: 4px;
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      font-size: 13px;
      flex-shrink: 0;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #666;
      transition: background 0.3s;
    }

    .status-dot.idle { background: #666; }
    .status-dot.wake { background: #a29bfe; animation: pulse 2s infinite; }
    .status-dot.listening { background: #4ecdc4; animation: pulse 1.2s infinite; }
    .status-dot.conversation { background: #00b894; animation: pulse 0.8s infinite; }
    .status-dot.thinking { background: #ffa502; animation: pulse 0.8s infinite; }
    .status-dot.playing { background: #ff6b6b; animation: pulse 1s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.4); }
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.5;
      animation: fadeIn 0.3s ease;
      word-break: break-word;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      align-self: flex-start;
      background: rgba(255,255,255,0.1);
      border-bottom-left-radius: 4px;
    }

    .message.system {
      align-self: center;
      background: rgba(255,255,255,0.05);
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      border-radius: 8px;
      padding: 5px 10px;
    }

    .input-area {
      padding: 10px 16px;
      border-top: 1px solid rgba(255,255,255,0.1);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }

    .input-area input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .input-area input:focus { border-color: rgba(255,255,255,0.5); }

    .btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
      flex-shrink: 0;
    }

    .btn:hover { transform: scale(1.1); }
    .btn:active { transform: scale(0.95); }

    .btn-mic { background: linear-gradient(135deg, #4ecdc4, #44bd9e); }
    .btn-mic.active { background: linear-gradient(135deg, #ff6b6b, #ee5a24); animation: pulse 1s infinite; }
    .btn-send { background: linear-gradient(135deg, #667eea, #764ba2); }
    .btn svg { width: 20px; height: 20px; fill: #fff; }

    .controls {
      display: flex;
      gap: 8px;
      padding: 0 16px 10px;
      justify-content: center;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .control-btn {
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.8);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .control-btn:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.4); }
    .control-btn.active { background: rgba(78,205,196,0.2); border-color: #4ecdc4; color: #4ecdc4; }

    .visualizer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 24px;
      flex-shrink: 0;
    }

    .visualizer.hidden { display: none; }

    .bar {
      width: 4px;
      background: #4ecdc4;
      border-radius: 2px;
      animation: barPulse 0.8s ease-in-out infinite;
    }

    .visualizer.conv .bar { background: #00b894; }

    @keyframes barPulse {
      0%, 100% { height: 4px; }
      50% { height: 18px; }
    }

    .bar:nth-child(1) { animation-delay: 0s; }
    .bar:nth-child(2) { animation-delay: 0.1s; }
    .bar:nth-child(3) { animation-delay: 0.2s; }
    .bar:nth-child(4) { animation-delay: 0.3s; }
    .bar:nth-child(5) { animation-delay: 0.4s; }

    /* 统计条 */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 6px 16px;
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      flex-shrink: 0;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .stats-bar span { white-space: nowrap; }
    .stats-bar .val { color: rgba(255,255,255,0.7); font-weight: 500; }

    /* 日志面板 */
    .log-panel {
      flex-shrink: 0;
      max-height: 0;
      background: rgba(0,0,0,0.9);
      border-top: 1px solid rgba(78,205,196,0.3);
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      transition: max-height 0.3s ease;
    }

    .log-panel.visible { max-height: 130px; padding: 6px 10px; }

    .log-entry {
      padding: 1px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .log-entry .lt { color: rgba(255,255,255,0.3); margin-right: 5px; }
    .log-entry .ls { color: #4ecdc4; margin-right: 5px; }
    .log-entry .lm { color: rgba(255,255,255,0.65); }
    .log-entry.lw .lm { color: #ffa502; }
    .log-entry.le .lm { color: #ff6b6b; }
    .log-entry.lc .lm { color: #a29bfe; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🦐 小龙虾语音助手</h1>
    <div class="subtitle">说"开始"唤醒 · 说"说完了"发送 · 说"结束结束"退出</div>
  </div>

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">点击下方按钮启动</span>
  </div>

  <div class="visualizer hidden" id="visualizer">
    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
  </div>

  <div class="chat-container" id="chatContainer"></div>

  <div class="controls">
    <button class="control-btn" id="btnWake" onclick="toggleWakeMode()">启动唤醒</button>
    <button class="control-btn" id="btnConversation" onclick="toggleConversationMode()">直接对话</button>
    <button class="control-btn" id="btnClear" onclick="clearChat()">清空</button>
    <button class="control-btn" id="btnLog" onclick="toggleLogPanel()">日志</button>
  </div>

  <div class="input-area">
    <input type="text" id="textInput" placeholder="输入文字或语音..." onkeydown="if(event.key==='Enter')sendText()">
    <button class="btn btn-mic" id="btnMic" onclick="toggleManualMic()">
      <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    </button>
    <button class="btn btn-send" onclick="sendText()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>

  <div class="stats-bar" id="statsBar">
    <span>说话 <span class="val" id="statSpeak">0.0s</span></span>
    <span>思考 <span class="val" id="statThink">0.0s</span></span>
    <span>播放 <span class="val" id="statPlay">0.0s</span></span>
    <span>总计 <span class="val" id="statTotal">0.0s</span></span>
  </div>

  <div class="log-panel" id="logPanel"></div>

  <script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    // ===== 状态 =====
    const STATE = {
      IDLE: 'idle',
      WAKE_LISTENING: 'wake',
      LISTENING: 'listening',
      CONVERSATION: 'conversation',
      THINKING: 'thinking',
      PLAYING: 'playing'
    };

    let currentState = STATE.IDLE;
    let recognition = null;
    let chatHistory = [];
    let currentAudio = null;
    let conversationMode = false;
    let lastTTSText = '';
    let accumulatedText = '';

    // ===== 关键词 =====
    const WAKE_WORDS = ['开始', '你好小龙虾', '小龙虾', '你好'];
    const SEND_WORDS = ['说完了', '发送'];
    const SEND_PATTERN = /ok\s*ok/i;
    const EXIT_PATTERN = /结束\s*结束/;
    const EXIT_WORDS = ['退出'];
    const CMD_REPLAY = ['重复播放', '再放一遍', '重复一遍'];
    const CMD_CLEAR = ['清空对话'];

    // ===== 音效系统 (Web Audio API) =====
    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function beep(freq, duration, startTime) {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
      osc.start(startTime);
      osc.stop(startTime + duration);
    }

    // 单音: 高频短促 (轻确认)
    function soundSingle() {
      const ctx = getAudioCtx();
      const t = ctx.currentTime;
      beep(880, 0.12, t);
    }

    // 双音: 升调 (重要动作)
    function soundDouble() {
      const ctx = getAudioCtx();
      const t = ctx.currentTime;
      beep(660, 0.1, t);
      beep(880, 0.12, t + 0.12);
    }

    // 三音: 降调 (模式切换)
    function soundTriple() {
      const ctx = getAudioCtx();
      const t = ctx.currentTime;
      beep(880, 0.09, t);
      beep(660, 0.09, t + 0.11);
      beep(440, 0.12, t + 0.22);
    }

    // ===== 计时统计 =====
    let timers = { speakStart: 0, thinkStart: 0, playStart: 0, turnStart: 0 };
    let stats = { speak: 0, think: 0, play: 0, total: 0 };

    function startTimer(key) { timers[key] = Date.now(); }

    function endTimer(key) {
      if (!timers[key]) return 0;
      const elapsed = (Date.now() - timers[key]) / 1000;
      timers[key] = 0;
      return elapsed;
    }

    function updateStats() {
      document.getElementById('statSpeak').textContent = stats.speak.toFixed(1) + 's';
      document.getElementById('statThink').textContent = stats.think.toFixed(1) + 's';
      document.getElementById('statPlay').textContent = stats.play.toFixed(1) + 's';
      document.getElementById('statTotal').textContent = stats.total.toFixed(1) + 's';
    }

    function resetTurnStats() {
      stats = { speak: 0, think: 0, play: 0, total: 0 };
      updateStats();
    }

    // ===== 日志 =====
    const MAX_LOG = 60;

    function log(msg, level) {
      const time = new Date().toTimeString().slice(0, 8);
      const panel = document.getElementById('logPanel');
      const div = document.createElement('div');
      const cls = level === 'warn' ? 'lw' : level === 'err' ? 'le' : level === 'cmd' ? 'lc' : '';
      div.className = 'log-entry ' + cls;
      div.innerHTML = `<span class="lt">${time}</span><span class="ls">[${currentState}]</span><span class="lm">${msg}</span>`;
      panel.appendChild(div);
      if (panel.children.length > MAX_LOG) panel.removeChild(panel.firstChild);
      panel.scrollTop = panel.scrollHeight;
    }

    function toggleLogPanel() {
      document.getElementById('logPanel').classList.toggle('visible');
      document.getElementById('btnLog').classList.toggle('active');
    }

    // ===== 状态管理 =====
    function setState(state, text) {
      const prev = currentState;
      currentState = state;
      document.getElementById('statusDot').className = 'status-dot ' + state;
      document.getElementById('statusText').textContent = text;

      const vis = document.getElementById('visualizer');
      if (state === STATE.LISTENING || state === STATE.CONVERSATION) {
        vis.classList.remove('hidden');
        vis.classList.toggle('conv', state === STATE.CONVERSATION);
      } else {
        vis.classList.add('hidden');
      }

      if (prev !== state) {
        log(`${prev} → ${state}`);
        playTransitionSound(prev, state);
      }
    }

    function playTransitionSound(from, to) {
      // 三音 (降调): 模式启动/退出
      if (from === STATE.IDLE && to === STATE.WAKE_LISTENING) { soundTriple(); return; }
      if (to === STATE.IDLE || (to === STATE.WAKE_LISTENING && from !== STATE.IDLE)) { soundTriple(); return; }

      // 双音 (升调): 唤醒成功 / 消息发送
      if (from === STATE.WAKE_LISTENING && to === STATE.LISTENING) { soundDouble(); return; }
      if (from === STATE.CONVERSATION && to === STATE.THINKING) { soundDouble(); return; }

      // 单音: 轻确认
      if (from === STATE.LISTENING && to === STATE.CONVERSATION) { soundSingle(); return; }
      if (from === STATE.PLAYING && to === STATE.LISTENING) { soundSingle(); return; }
    }

    function addMessage(role, content) {
      const container = document.getElementById('chatContainer');
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = content;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;

      if (role === 'user' || role === 'assistant') {
        chatHistory.push({ role, content });
        if (chatHistory.length > 20) chatHistory = chatHistory.slice(-20);
      }
    }

    // ===== 语音识别 =====
    function createRecognition() {
      if (!SpeechRecognition) {
        addMessage('system', '浏览器不支持语音识别');
        return null;
      }
      const rec = new SpeechRecognition();
      rec.lang = 'zh-CN';
      rec.continuous = true;
      rec.interimResults = true;
      return rec;
    }

    function updateInputDisplay(text, isFinal) {
      const input = document.getElementById('textInput');
      input.value = text;
      input.style.color = isFinal ? '#fff' : 'rgba(255,255,255,0.5)';
    }

    function stopRecognition() {
      if (recognition) {
        recognition.onend = null;
        recognition.onresult = null;
        recognition.onerror = null;
        try { recognition.stop(); } catch(e) {}
        recognition = null;
      }
    }

    // ===== 关键词匹配 =====
    function matchKeyword(text, words) {
      return words.some(w => text.includes(w));
    }

    function isSendCommand(text) {
      return matchKeyword(text, SEND_WORDS) || SEND_PATTERN.test(text);
    }

    function isExitCommand(text) {
      return EXIT_PATTERN.test(text) || matchKeyword(text, EXIT_WORDS);
    }

    function isReplayCommand(text) {
      return matchKeyword(text, CMD_REPLAY);
    }

    function isClearCommand(text) {
      return matchKeyword(text, CMD_CLEAR);
    }

    function stripSendCommand(text) {
      let c = text;
      for (const w of SEND_WORDS) {
        const idx = c.lastIndexOf(w);
        if (idx >= 0) c = c.slice(0, idx) + c.slice(idx + w.length);
      }
      c = c.replace(/ok\s*ok\s*$/i, '');
      return c.trim();
    }

    // ===== 唤醒模式 =====
    function toggleWakeMode() {
      if (currentState === STATE.WAKE_LISTENING) {
        exitAllModes();
      } else {
        exitAllModes();
        startWakeListening();
      }
    }

    function startWakeListening() {
      stopRecognition();
      recognition = createRecognition();
      if (!recognition) return;

      document.getElementById('btnWake').classList.add('active');
      document.getElementById('btnWake').textContent = '停止监听';
      setState(STATE.WAKE_LISTENING, '等待唤醒: "开始" / "小龙虾"');
      log('唤醒监听启动');

      recognition.onresult = (event) => {
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript.trim();
          const isFinal = event.results[i].isFinal;
          updateInputDisplay(transcript, isFinal);

          if (matchKeyword(transcript, WAKE_WORDS)) {
            updateInputDisplay('', true);
            addMessage('system', '唤醒成功!');
            log('唤醒: ' + transcript, 'cmd');
            enterConversationMode();
            return;
          }

          if (isFinal) setTimeout(() => updateInputDisplay('', true), 600);
        }
      };

      recognition.onend = () => {
        if (currentState === STATE.WAKE_LISTENING) {
          setTimeout(() => {
            if (currentState === STATE.WAKE_LISTENING) try { recognition.start(); } catch(e) {}
          }, 100);
        }
      };

      recognition.onerror = (e) => {
        if (e.error === 'no-speech' || e.error === 'aborted') return;
        log('唤醒错误: ' + e.error, 'err');
      };

      recognition.start();
    }

    // ===== 对话模式 =====
    function toggleConversationMode() {
      if (conversationMode) { exitAllModes(); }
      else { exitAllModes(); enterConversationMode(); }
    }

    function enterConversationMode() {
      conversationMode = true;
      accumulatedText = '';
      resetTurnStats();
      document.getElementById('btnConversation').classList.add('active');
      document.getElementById('btnConversation').textContent = '退出对话';
      document.getElementById('btnWake').classList.remove('active');
      document.getElementById('btnWake').textContent = '启动唤醒';
      log('进入对话模式');
      startListening();
    }

    // ===== LISTENING 状态 =====
    function startListening() {
      if (!conversationMode) return;
      stopRecognition();
      accumulatedText = '';
      recognition = createRecognition();
      if (!recognition) return;

      setState(STATE.LISTENING, '聆听中... 说话后说"说完了"发送');
      document.getElementById('btnMic').classList.add('active');

      recognition.onresult = handleListeningResult;

      recognition.onend = () => {
        document.getElementById('btnMic').classList.remove('active');
        if (conversationMode && currentState === STATE.LISTENING) {
          setTimeout(() => {
            if (conversationMode && currentState === STATE.LISTENING) {
              try { recognition.start(); document.getElementById('btnMic').classList.add('active'); }
              catch(e) { setTimeout(() => startListening(), 500); }
            }
          }, 200);
        }
      };

      recognition.onerror = (e) => {
        if (e.error === 'no-speech' || e.error === 'aborted') return;
        log('监听错误: ' + e.error, 'err');
        if (e.error === 'not-allowed') { addMessage('system', '麦克风权限被拒绝'); exitAllModes(); }
      };

      try { recognition.start(); } catch(e) { setTimeout(() => startListening(), 500); }
    }

    function handleListeningResult(event) {
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript.trim();
        if (!transcript) continue;

        if (event.results[i].isFinal) {
          log('识别: ' + transcript);

          if (isExitCommand(transcript)) {
            log('退出对话', 'cmd');
            updateInputDisplay('', true);
            addMessage('system', '对话已退出');
            exitAllModes();
            startWakeListening();
            return;
          }

          if (isReplayCommand(transcript)) {
            log('重复播放', 'cmd');
            updateInputDisplay('', true);
            if (lastTTSText) executeReplay();
            else addMessage('system', '没有可重复的内容');
            return;
          }

          if (isClearCommand(transcript)) {
            log('清空对话', 'cmd');
            updateInputDisplay('', true);
            clearChat();
            startListening();
            return;
          }

          if (isSendCommand(transcript)) {
            const cleaned = stripSendCommand(transcript);
            if (accumulatedText || cleaned) {
              accumulatedText += cleaned;
              log('发送: ' + accumulatedText, 'cmd');
              updateInputDisplay('', true);
              const toSend = accumulatedText.trim();
              accumulatedText = '';
              stats.speak = endTimer('speakStart');
              updateStats();
              processUserInput(toSend);
            } else {
              updateInputDisplay('', true);
              addMessage('system', '没有内容');
              startListening();
            }
            return;
          }

          // 非关键词 → 进入 CONVERSATION
          accumulatedText += transcript;
          updateInputDisplay(accumulatedText, true);
          startTimer('speakStart');
          enterConversationState();
          return;
        } else {
          updateInputDisplay(accumulatedText + transcript, false);
        }
      }
    }

    // ===== CONVERSATION 状态 =====
    function enterConversationState() {
      if (currentState === STATE.CONVERSATION) return;
      setState(STATE.CONVERSATION, '说话中... "说完了"或"OK OK"发送');
      if (!recognition) return;
      recognition.onresult = handleConversationResult;
    }

    function handleConversationResult(event) {
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript.trim();
        if (!transcript) continue;

        if (event.results[i].isFinal) {
          log('对话: ' + transcript);

          if (isSendCommand(transcript)) {
            const cleaned = stripSendCommand(transcript);
            accumulatedText += cleaned;
            log('发送: ' + accumulatedText, 'cmd');
            updateInputDisplay('', true);
            const toSend = accumulatedText.trim();
            accumulatedText = '';
            stats.speak = endTimer('speakStart');
            updateStats();
            if (toSend) processUserInput(toSend);
            else { addMessage('system', '没有内容'); startListening(); }
            return;
          }

          if (isExitCommand(transcript)) {
            log('退出', 'cmd');
            accumulatedText = '';
            updateInputDisplay('', true);
            addMessage('system', '对话已退出');
            exitAllModes();
            startWakeListening();
            return;
          }

          if (isReplayCommand(transcript)) {
            log('重复播放', 'cmd');
            accumulatedText = '';
            updateInputDisplay('', true);
            if (lastTTSText) executeReplay();
            else { addMessage('system', '没有可重复的内容'); startListening(); }
            return;
          }

          accumulatedText += transcript;
          updateInputDisplay(accumulatedText, true);
        } else {
          updateInputDisplay(accumulatedText + transcript, false);
        }
      }
    }

    // ===== 处理 → AI → TTS =====
    async function processUserInput(text) {
      stopRecognition();
      document.getElementById('btnMic').classList.remove('active');
      document.getElementById('textInput').value = '';
      document.getElementById('textInput').style.color = '#fff';
      addMessage('user', text);

      startTimer('turnStart');
      startTimer('thinkStart');
      setState(STATE.THINKING, 'AI 思考中...');
      log('→ AI: ' + text.slice(0, 60));

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, history: chatHistory.slice(0, -1) })
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
          throw new Error(err.error || `请求失败 ${res.status}`);
        }

        const data = await res.json();
        stats.think = endTimer('thinkStart');
        updateStats();
        log(`← AI (${stats.think.toFixed(1)}s): ` + data.reply.slice(0, 40));

        addMessage('assistant', data.reply);
        lastTTSText = data.reply;

        startTimer('playStart');
        setState(STATE.PLAYING, '播报中...');
        await playTTS(data.reply);
        stats.play = endTimer('playStart');
        stats.total = endTimer('turnStart');
        updateStats();
        log(`播放完成 (${stats.play.toFixed(1)}s) 总计${stats.total.toFixed(1)}s`);

      } catch (err) {
        addMessage('system', '出错: ' + err.message);
        log('错误: ' + err.message, 'err');
        endTimer('thinkStart');
      }

      if (conversationMode) startListening();
      else setState(STATE.IDLE, '就绪');
    }

    async function executeReplay() {
      stopRecognition();
      document.getElementById('btnMic').classList.remove('active');
      addMessage('system', '重复播放...');
      startTimer('playStart');
      setState(STATE.PLAYING, '重复播报中...');
      await playTTS(lastTTSText);
      stats.play = endTimer('playStart');
      updateStats();
      if (conversationMode) startListening();
      else setState(STATE.IDLE, '就绪');
    }

    // ===== TTS =====
    async function playTTS(text) {
      try {
        const res = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });

        if (!res.ok) throw new Error('TTS failed');
        const blob = await res.blob();
        if (blob.type.includes('json')) throw new Error('TTS error');

        const url = URL.createObjectURL(blob);
        return new Promise((resolve) => {
          if (currentAudio) { currentAudio.pause(); currentAudio = null; }
          currentAudio = new Audio(url);
          currentAudio.onended = () => { URL.revokeObjectURL(url); currentAudio = null; resolve(); };
          currentAudio.onerror = () => { URL.revokeObjectURL(url); currentAudio = null; fallbackTTS(text).then(resolve); };
          currentAudio.play().catch(() => { currentAudio = null; fallbackTTS(text).then(resolve); });
        });
      } catch {
        await fallbackTTS(text);
      }
    }

    function fallbackTTS(text) {
      return new Promise((resolve) => {
        if (!('speechSynthesis' in window)) { resolve(); return; }
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-CN'; u.rate = 1.1;
        u.onend = resolve; u.onerror = resolve;
        speechSynthesis.speak(u);
      });
    }

    // ===== 手动操作 =====
    function toggleManualMic() {
      if (currentState === STATE.LISTENING || currentState === STATE.CONVERSATION) exitAllModes();
      else if (currentState === STATE.IDLE || currentState === STATE.WAKE_LISTENING) { exitAllModes(); enterConversationMode(); }
    }

    async function sendText() {
      const input = document.getElementById('textInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      const wasIn = conversationMode;
      stopRecognition();
      if (!conversationMode) conversationMode = true;
      await processUserInput(text);
      if (!wasIn && !conversationMode) setState(STATE.IDLE, '就绪');
    }

    function exitAllModes() {
      conversationMode = false;
      accumulatedText = '';
      stopRecognition();
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      speechSynthesis.cancel();

      document.getElementById('btnWake').classList.remove('active');
      document.getElementById('btnWake').textContent = '启动唤醒';
      document.getElementById('btnConversation').classList.remove('active');
      document.getElementById('btnConversation').textContent = '直接对话';
      document.getElementById('btnMic').classList.remove('active');

      setState(STATE.IDLE, '已停止');
      log('退出所有模式');
    }

    function clearChat() {
      document.getElementById('chatContainer').innerHTML = '';
      chatHistory = [];
      addMessage('system', '对话已清空');
    }

    addMessage('system', '小龙虾语音助手就绪');
    addMessage('system', '"开始"唤醒 → 说话+"说完了"发送 → "结束结束"退出');
    addMessage('system', '命令: "重复播放" "清空对话" "退出"');
    log('初始化完成');
  </script>
</body>
