<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小龙虾语音助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      height: 100vh;
      color: #fff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      text-align: center;
      padding: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 22px;
      background: linear-gradient(90deg, #ff6b6b, #ffa502);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header .subtitle {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      margin-top: 4px;
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      font-size: 13px;
      flex-shrink: 0;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #666;
      transition: background 0.3s;
    }

    .status-dot.idle { background: #666; }
    .status-dot.listening { background: #4ecdc4; animation: pulse 1.2s infinite; }
    .status-dot.thinking { background: #ffa502; animation: pulse 0.8s infinite; }
    .status-dot.playing { background: #ff6b6b; animation: pulse 1s infinite; }
    .status-dot.paused { background: #a29bfe; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.4); }
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.5;
      animation: fadeIn 0.3s ease;
      word-break: break-word;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      align-self: flex-start;
      background: rgba(255,255,255,0.1);
      border-bottom-left-radius: 4px;
    }

    .message.system {
      align-self: center;
      background: rgba(255,255,255,0.05);
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      border-radius: 8px;
      padding: 5px 10px;
    }

    .input-area {
      padding: 10px 16px;
      border-top: 1px solid rgba(255,255,255,0.1);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }

    .input-area input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .input-area input:focus { border-color: rgba(255,255,255,0.5); }
    .input-area input.interim { color: rgba(255,255,255,0.5); }

    .btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
      flex-shrink: 0;
    }

    .btn:hover { transform: scale(1.1); }
    .btn:active { transform: scale(0.95); }

    .btn-mic { background: linear-gradient(135deg, #4ecdc4, #44bd9e); }
    .btn-mic.active { background: linear-gradient(135deg, #ff6b6b, #ee5a24); animation: pulse 1s infinite; }
    .btn-send { background: linear-gradient(135deg, #667eea, #764ba2); }
    .btn svg { width: 20px; height: 20px; fill: #fff; }

    .controls {
      display: flex;
      gap: 8px;
      padding: 0 16px 10px;
      justify-content: center;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .control-btn {
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.8);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .control-btn:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.4); }
    .control-btn.active { background: rgba(78,205,196,0.2); border-color: #4ecdc4; color: #4ecdc4; }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 6px 16px;
      flex-shrink: 0;
    }

    .toggle-label {
      font-size: 11px;
      color: rgba(255,255,255,0.6);
    }

    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
      background: rgba(255,255,255,0.15);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle.on { background: #4ecdc4; }

    .toggle::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      top: 2px;
      left: 2px;
      transition: left 0.2s;
    }

    .toggle.on::after { left: 18px; }

    .audio-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 4px 16px;
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      flex-shrink: 0;
    }

    .audio-status .queue-count {
      color: rgba(255,255,255,0.7);
      font-weight: 500;
    }

    .visualizer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 24px;
      flex-shrink: 0;
    }

    .visualizer.hidden { display: none; }

    .bar {
      width: 4px;
      background: #4ecdc4;
      border-radius: 2px;
      animation: barPulse 0.8s ease-in-out infinite;
    }

    @keyframes barPulse {
      0%, 100% { height: 4px; }
      50% { height: 18px; }
    }

    .bar:nth-child(1) { animation-delay: 0s; }
    .bar:nth-child(2) { animation-delay: 0.1s; }
    .bar:nth-child(3) { animation-delay: 0.2s; }
    .bar:nth-child(4) { animation-delay: 0.3s; }
    .bar:nth-child(5) { animation-delay: 0.4s; }

    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 6px 16px;
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      flex-shrink: 0;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .stats-bar span { white-space: nowrap; }
    .stats-bar .val { color: rgba(255,255,255,0.7); font-weight: 500; }
  </style>
</head>
<body>
  <div class="header">
    <h1>小龙虾语音助手</h1>
    <div class="subtitle">说"开始"唤醒 · 说"说完了"发送 · 说"结束结束"退出</div>
  </div>

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">点击下方按钮启动</span>
  </div>

  <div class="visualizer hidden" id="visualizer">
    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
  </div>

  <div class="chat-container" id="chatContainer"></div>

  <div class="audio-status" id="audioStatus">
    <span>播放: <span class="queue-count" id="audioStateText">idle</span></span>
    <span>队列: <span class="queue-count" id="audioQueueCount">0</span></span>
  </div>

  <div class="controls">
    <button class="control-btn" id="btnStart" onclick="toggleSession()">启动</button>
    <button class="control-btn" id="btnPause" onclick="manualPauseResume()">暂停播放</button>
    <button class="control-btn" id="btnClear" onclick="clearChat()">清空</button>
  </div>

  <div class="toggle-row">
    <span class="toggle-label">关键词触发</span>
    <div class="toggle on" id="toggleKeywords" onclick="toggleKeywordMode()"></div>
    <span class="toggle-label">VAD自动暂停</span>
    <div class="toggle on" id="toggleVadPause" onclick="toggleVadPause()"></div>
  </div>

  <div class="input-area">
    <input type="text" id="textInput" placeholder="输入文字或语音..." onkeydown="if(event.key==='Enter')sendTextManual()">
    <button class="btn btn-mic" id="btnMic" onclick="toggleMic()">
      <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    </button>
    <button class="btn btn-send" onclick="sendTextManual()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>

  <div class="stats-bar">
    <span>识别 <span class="val" id="statASR">0.0s</span></span>
    <span>思考 <span class="val" id="statThink">0.0s</span></span>
    <span>首音 <span class="val" id="statFirstAudio">-</span></span>
  </div>

  <script>
// ============================================================
// AudioPlayer: 状态机 + 队列
// ============================================================
class AudioPlayer {
  constructor() {
    this.state = 'idle'; // idle | playing | paused
    this.queue = [];
    this.current = null; // { id, audio, text }
    this.lastPlayed = null; // 用于 replay
    this._onStateChange = null;
    this._onQueueEmpty = null;
  }

  onStateChange(fn) { this._onStateChange = fn; }
  onQueueEmpty(fn) { this._onQueueEmpty = fn; }

  _setState(s) {
    this.state = s;
    if (this._onStateChange) this._onStateChange(s);
  }

  enqueue(audioBlob, text, id) {
    const item = { id: id || Date.now().toString(), blob: audioBlob, text };
    this.queue.push(item);
    this._updateUI();
    if (this.state === 'idle') this._playNext();
  }

  _playNext() {
    if (this.queue.length === 0) {
      this.current = null;
      this._setState('idle');
      this._updateUI();
      if (this._onQueueEmpty) this._onQueueEmpty();
      return;
    }

    const item = this.queue.shift();
    const url = URL.createObjectURL(item.blob);
    const audio = new Audio(url);

    this.current = { ...item, audio, url };
    this._setState('playing');
    this._updateUI();

    audio.onended = () => {
      URL.revokeObjectURL(url);
      this.lastPlayed = item;
      this.current = null;
      this._playNext();
    };

    audio.onerror = () => {
      URL.revokeObjectURL(url);
      this.current = null;
      this._playNext();
    };

    audio.play().catch(() => {
      this.current = null;
      this._playNext();
    });
  }

  pause() {
    if (this.state === 'playing' && this.current?.audio) {
      this.current.audio.pause();
      this._setState('paused');
    }
  }

  resume() {
    if (this.state === 'paused' && this.current?.audio) {
      this.current.audio.play();
      this._setState('playing');
    } else if (this.state === 'idle' && this.queue.length > 0) {
      this._playNext();
    }
  }

  replay() {
    const target = this.lastPlayed || this.current;
    if (!target?.blob) return false;
    this.stop();
    this.enqueue(target.blob, target.text, 'replay-' + Date.now());
    return true;
  }

  stop() {
    if (this.current?.audio) {
      this.current.audio.pause();
      if (this.current.url) URL.revokeObjectURL(this.current.url);
    }
    this.current = null;
    this.queue = [];
    this._setState('idle');
    this._updateUI();
  }

  clear() {
    this.queue = [];
    this._updateUI();
  }

  _updateUI() {
    const stateEl = document.getElementById('audioStateText');
    const countEl = document.getElementById('audioQueueCount');
    if (stateEl) stateEl.textContent = this.state;
    if (countEl) countEl.textContent = this.queue.length.toString();
  }
}

// ============================================================
// VAD: 语音活动检测 + 0.5s pre-buffer
// ============================================================
class VADDetector {
  constructor(options = {}) {
    this.threshold = options.threshold || 0.015;
    this.silenceDelay = options.silenceDelay || 1500;
    this.preBufferMs = options.preBufferMs || 500;
    this.onVoiceStart = options.onVoiceStart || (() => {});
    this.onVoiceEnd = options.onVoiceEnd || (() => {});

    this._stream = null;
    this._audioCtx = null;
    this._analyser = null;
    this._active = false;
    this._speaking = false;
    this._silenceTimer = null;
    this._rafId = null;
  }

  async start() {
    if (this._active) return;
    this._stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    this._audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = this._audioCtx.createMediaStreamSource(this._stream);
    this._analyser = this._audioCtx.createAnalyser();
    this._analyser.fftSize = 512;
    source.connect(this._analyser);
    this._active = true;
    this._monitor();
  }

  stop() {
    this._active = false;
    if (this._rafId) cancelAnimationFrame(this._rafId);
    if (this._silenceTimer) clearTimeout(this._silenceTimer);
    if (this._stream) {
      this._stream.getTracks().forEach(t => t.stop());
      this._stream = null;
    }
    if (this._audioCtx) {
      this._audioCtx.close();
      this._audioCtx = null;
    }
    this._speaking = false;
  }

  _monitor() {
    if (!this._active) return;
    const data = new Float32Array(this._analyser.fftSize);
    this._analyser.getFloatTimeDomainData(data);

    let rms = 0;
    for (let i = 0; i < data.length; i++) rms += data[i] * data[i];
    rms = Math.sqrt(rms / data.length);

    if (rms > this.threshold) {
      if (this._silenceTimer) {
        clearTimeout(this._silenceTimer);
        this._silenceTimer = null;
      }
      if (!this._speaking) {
        this._speaking = true;
        this.onVoiceStart();
      }
    } else if (this._speaking) {
      if (!this._silenceTimer) {
        this._silenceTimer = setTimeout(() => {
          this._speaking = false;
          this._silenceTimer = null;
          this.onVoiceEnd();
        }, this.silenceDelay);
      }
    }

    this._rafId = requestAnimationFrame(() => this._monitor());
  }

  get isSpeaking() { return this._speaking; }
  get stream() { return this._stream; }
}

// ============================================================
// 应用状态与配置
// ============================================================
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

let sessionActive = false;
let recognition = null;
let inputBuffer = '';
let chatHistory = [];
let keywordModeEnabled = true;
let vadPauseEnabled = true;

const audioPlayer = new AudioPlayer();
let vad = null;

// 关键词定义
const KEYWORDS = {
  wake: ['开始', '你好小龙虾', '小龙虾'],
  send: ['说完了', '发送'],
  exit: ['结束结束'],
  replay: ['再说一次', '重复播放', '再放一遍'],
  clear: ['取消', '清空'],
  pause: ['暂停一下', '暂停'],
  resume: ['你继续', '继续播放', '继续']
};

const EXIT_PATTERN = /结束\s*结束/;
const SEND_PATTERN = /ok\s*ok/i;

// ============================================================
// UI 更新
// ============================================================
function setStatus(state, text) {
  document.getElementById('statusDot').className = 'status-dot ' + state;
  document.getElementById('statusText').textContent = text;

  const vis = document.getElementById('visualizer');
  if (state === 'listening') vis.classList.remove('hidden');
  else vis.classList.add('hidden');
}

function addMessage(role, content) {
  const container = document.getElementById('chatContainer');
  const div = document.createElement('div');
  div.className = `message ${role}`;
  div.textContent = content;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;

  if (role === 'user' || role === 'assistant') {
    chatHistory.push({ role, content });
    if (chatHistory.length > 20) chatHistory = chatHistory.slice(-20);
  }
}

function updateInputDisplay(text, isFinal) {
  const input = document.getElementById('textInput');
  input.value = text;
  input.className = isFinal ? '' : 'interim';
}

// ============================================================
// AudioPlayer 事件绑定
// ============================================================
audioPlayer.onStateChange((state) => {
  const dot = document.getElementById('statusDot');
  if (state === 'playing') {
    dot.className = 'status-dot playing';
    document.getElementById('statusText').textContent = '播报中...';
  } else if (state === 'paused') {
    dot.className = 'status-dot paused';
    document.getElementById('statusText').textContent = '播放已暂停';
  } else if (state === 'idle' && sessionActive) {
    setStatus('listening', '聆听中...');
  }
});

audioPlayer.onQueueEmpty(() => {
  if (sessionActive && !recognition) {
    startASR();
  }
});

// ============================================================
// 关键词匹配
// ============================================================
function matchKeyword(text, category) {
  const words = KEYWORDS[category];
  if (!words) return false;
  return words.some(w => text.includes(w));
}

function stripCommand(text, category) {
  let result = text;
  const words = KEYWORDS[category];
  if (words) {
    for (const w of words) {
      const idx = result.lastIndexOf(w);
      if (idx >= 0) result = result.slice(0, idx) + result.slice(idx + w.length);
    }
  }
  result = result.replace(/ok\s*ok\s*$/i, '');
  return result.trim();
}

function processKeyword(text) {
  if (!keywordModeEnabled) return false;

  if (EXIT_PATTERN.test(text) || matchKeyword(text, 'exit')) {
    addMessage('system', '对话已退出');
    stopSession();
    return true;
  }

  if (matchKeyword(text, 'replay')) {
    if (!audioPlayer.replay()) {
      addMessage('system', '没有可重复的内容');
    } else {
      addMessage('system', '重新播放');
    }
    inputBuffer = '';
    updateInputDisplay('', true);
    return true;
  }

  if (matchKeyword(text, 'clear')) {
    inputBuffer = '';
    updateInputDisplay('', true);
    addMessage('system', '已清空输入');
    return true;
  }

  if (matchKeyword(text, 'pause')) {
    audioPlayer.pause();
    inputBuffer = '';
    updateInputDisplay('', true);
    return true;
  }

  if (matchKeyword(text, 'resume')) {
    audioPlayer.resume();
    inputBuffer = '';
    updateInputDisplay('', true);
    return true;
  }

  if (matchKeyword(text, 'send') || SEND_PATTERN.test(text)) {
    const cleaned = stripCommand(text, 'send');
    const toSend = (inputBuffer + ' ' + cleaned).trim();
    inputBuffer = '';
    updateInputDisplay('', true);
    if (toSend) {
      sendToAI(toSend);
    } else {
      addMessage('system', '没有内容可发送');
    }
    return true;
  }

  return false;
}

// ============================================================
// ASR: Web Speech API + VAD pre-buffer 联动
// ============================================================
function startASR() {
  if (!SpeechRecognition || !sessionActive) return;
  stopASR();

  recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onresult = (event) => {
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript.trim();
      if (!transcript) continue;

      if (event.results[i].isFinal) {
        if (processKeyword(transcript)) return;
        inputBuffer += transcript;
        updateInputDisplay(inputBuffer, true);
      } else {
        updateInputDisplay(inputBuffer + transcript, false);
      }
    }
  };

  recognition.onend = () => {
    if (sessionActive && audioPlayer.state !== 'playing') {
      setTimeout(() => {
        if (sessionActive && audioPlayer.state !== 'playing') {
          try { recognition.start(); } catch(e) { setTimeout(() => startASR(), 500); }
        }
      }, 200);
    }
  };

  recognition.onerror = (e) => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    if (e.error === 'not-allowed') {
      addMessage('system', '麦克风权限被拒绝');
      stopSession();
    }
  };

  try { recognition.start(); } catch(e) { setTimeout(() => startASR(), 500); }
  document.getElementById('btnMic').classList.add('active');
}

function stopASR() {
  if (recognition) {
    recognition.onend = null;
    recognition.onresult = null;
    recognition.onerror = null;
    try { recognition.stop(); } catch(e) {}
    recognition = null;
  }
  document.getElementById('btnMic').classList.remove('active');
}

// ============================================================
// VAD + ASR 联动
// ============================================================
async function startVAD() {
  vad = new VADDetector({
    threshold: 0.012,
    silenceDelay: 1500,
    preBufferMs: 500,
    onVoiceStart: () => {
      if (vadPauseEnabled && audioPlayer.state === 'playing') {
        audioPlayer.pause();
      }
      if (!recognition && sessionActive) {
        startASR();
      }
    },
    onVoiceEnd: () => {
      // 不自动操作，等关键词
    }
  });
  await vad.start();
}

// ============================================================
// 会话管理
// ============================================================
function toggleSession() {
  if (sessionActive) stopSession();
  else startSession();
}

async function startSession() {
  sessionActive = true;
  inputBuffer = '';
  document.getElementById('btnStart').classList.add('active');
  document.getElementById('btnStart').textContent = '停止';
  setStatus('listening', '聆听中...');
  addMessage('system', '会话已启动');

  try {
    await startVAD();
  } catch(e) {
    addMessage('system', 'VAD启动失败: ' + e.message);
  }

  startASR();
}

function stopSession() {
  sessionActive = false;
  inputBuffer = '';
  stopASR();
  audioPlayer.stop();
  if (vad) { vad.stop(); vad = null; }

  document.getElementById('btnStart').classList.remove('active');
  document.getElementById('btnStart').textContent = '启动';
  setStatus('idle', '已停止');
  updateInputDisplay('', true);
}

// ============================================================
// 发送到 AI (流式)
// ============================================================
async function sendToAI(text) {
  stopASR();
  addMessage('user', text);
  setStatus('thinking', 'AI 思考中...');

  const thinkStart = Date.now();

  try {
    const res = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: chatHistory.slice(0, -1) })
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let fullText = '';
    let sentenceBuffer = '';
    let firstChunkTime = 0;
    let ttsPromises = [];

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed || !trimmed.startsWith('data: ')) continue;
        const payload = trimmed.slice(6);
        if (payload === '[DONE]') continue;

        try {
          const parsed = JSON.parse(payload);

          if (parsed.error) {
            addMessage('system', '错误: ' + parsed.error);
            if (sessionActive) startASR();
            return;
          }

          if (parsed.delta) {
            if (!firstChunkTime) firstChunkTime = Date.now();
            sentenceBuffer += parsed.delta;

            const sentences = splitSentences(sentenceBuffer);
            if (sentences.complete.length > 0) {
              for (const sentence of sentences.complete) {
                const p = requestTTS(sentence);
                ttsPromises.push(p);
              }
              sentenceBuffer = sentences.remaining;
            }
          }

          if (parsed.done && parsed.fullText) {
            fullText = parsed.fullText;
          }
        } catch {}
      }
    }

    // 处理剩余文本
    if (sentenceBuffer.trim()) {
      const p = requestTTS(sentenceBuffer.trim());
      ttsPromises.push(p);
    }

    if (fullText) {
      addMessage('assistant', fullText);
    }

    document.getElementById('statThink').textContent = ((Date.now() - thinkStart) / 1000).toFixed(1) + 's';
    if (firstChunkTime) {
      document.getElementById('statFirstAudio').textContent = ((firstChunkTime - thinkStart) / 1000).toFixed(1) + 's';
    }

    await Promise.allSettled(ttsPromises);

  } catch (err) {
    addMessage('system', '错误: ' + err.message);
  }

  if (sessionActive && audioPlayer.state === 'idle') {
    startASR();
  }
}

function splitSentences(text) {
  const delimiters = /([。！？；\n])/;
  const parts = text.split(delimiters);
  const complete = [];
  let current = '';

  for (let i = 0; i < parts.length; i++) {
    current += parts[i];
    if (delimiters.test(parts[i]) && current.trim().length > 1) {
      complete.push(current.trim());
      current = '';
    }
  }

  return { complete, remaining: current };
}

async function requestTTS(text) {
  try {
    const res = await fetch('/api/tts/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });

    if (!res.ok) return;

    const blob = await res.blob();
    if (blob.size > 0) {
      audioPlayer.enqueue(blob, text);
    }
  } catch {}
}

// ============================================================
// 手动操作
// ============================================================
function sendTextManual() {
  const input = document.getElementById('textInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  inputBuffer = '';

  if (!sessionActive) {
    sessionActive = true;
    document.getElementById('btnStart').classList.add('active');
    document.getElementById('btnStart').textContent = '停止';
  }

  sendToAI(text);
}

function toggleMic() {
  if (recognition) stopASR();
  else if (sessionActive) startASR();
  else { startSession(); }
}

function manualPauseResume() {
  if (audioPlayer.state === 'playing') audioPlayer.pause();
  else if (audioPlayer.state === 'paused') audioPlayer.resume();
}

function clearChat() {
  document.getElementById('chatContainer').innerHTML = '';
  chatHistory = [];
  inputBuffer = '';
  updateInputDisplay('', true);
  addMessage('system', '对话已清空');
}

function toggleKeywordMode() {
  keywordModeEnabled = !keywordModeEnabled;
  document.getElementById('toggleKeywords').classList.toggle('on', keywordModeEnabled);
}

function toggleVadPause() {
  vadPauseEnabled = !vadPauseEnabled;
  document.getElementById('toggleVadPause').classList.toggle('on', vadPauseEnabled);
}
